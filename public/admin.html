<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamaCV Admin - CV Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .field-item, .template-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .field-header, .template-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .field-name, .template-name {
            font-weight: 600;
            font-size: 1.1em;
            color: #333;
        }

        .field-description, .template-description {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 30px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .template-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .template-badge.modern {
            background: #667eea;
            color: white;
        }

        .template-badge.traditional {
            background: #2c3e50;
            color: white;
        }

        .template-badge.creative {
            background: #e74c3c;
            color: white;
        }

        .template-badge.functional {
            background: #16a085;
            color: white;
        }

        .template-badge.executive {
            background: #1a1a2e;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 SamaCV Admin Panel</h1>
            <p>Configure CV fields and template settings</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="mandatoryCount">0</div>
                <div class="stat-label">Mandatory Fields</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeTemplatesCount">0</div>
                <div class="stat-label">Active Templates</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalFieldsCount">0</div>
                <div class="stat-label">Total Fields</div>
            </div>
        </div>

        <div class="card">
            <h2>📋 CV Fields Configuration</h2>
            <p style="margin-bottom: 20px; color: #666;">Toggle which fields are mandatory for CV creation</p>
            <div id="fieldsContainer"></div>
        </div>

        <div class="card">
            <h2>🎨 Template Configuration</h2>
            <p style="margin-bottom: 20px; color: #666;">Enable or disable CV templates available to users</p>
            <div id="templatesContainer"></div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="saveConfiguration()">💾 Save Configuration</button>
            <button class="btn btn-secondary" onclick="loadConfiguration()">🔄 Reload</button>
            <button class="btn btn-danger" onclick="resetToDefaults()">⚠️ Reset to Defaults</button>
        </div>
    </div>

    <script>
        let currentConfig = null;

        async function loadConfiguration() {
            try {
                const response = await fetch('/api/admin/cv-config');
                currentConfig = await response.json();
                renderConfiguration();
                showMessage('Configuration loaded successfully', 'success');
            } catch (error) {
                showMessage('Failed to load configuration: ' + error.message, 'error');
            }
        }

        function renderConfiguration() {
            // Render fields
            const fieldsContainer = document.getElementById('fieldsContainer');
            fieldsContainer.innerHTML = '';

            currentConfig.fields.forEach((field, index) => {
                const fieldDiv = document.createElement('div');
                fieldDiv.className = 'field-item';
                fieldDiv.innerHTML = `
                    <div class="field-header">
                        <div>
                            <div class="field-name">${field.label || field.fieldName}</div>
                            <div class="field-description">${field.description || ''}</div>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" ${field.isMandatory ? 'checked' : ''}
                                   onchange="toggleFieldMandatory(${index})">
                            <span class="slider"></span>
                        </label>
                    </div>
                `;
                fieldsContainer.appendChild(fieldDiv);
            });

            // Render templates
            const templatesContainer = document.getElementById('templatesContainer');
            templatesContainer.innerHTML = '';

            currentConfig.templates.forEach((template, index) => {
                const templateDiv = document.createElement('div');
                templateDiv.className = 'template-item';
                templateDiv.innerHTML = `
                    <div class="template-header">
                        <div>
                            <div class="template-name">
                                ${template.templateName}
                                <span class="template-badge ${template.category}">${template.category}</span>
                            </div>
                            <div class="template-description">${template.description || ''}</div>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" ${template.isActive ? 'checked' : ''}
                                   onchange="toggleTemplateActive(${index})">
                            <span class="slider"></span>
                        </label>
                    </div>
                `;
                templatesContainer.appendChild(templateDiv);
            });

            updateStats();
        }

        function toggleFieldMandatory(index) {
            currentConfig.fields[index].isMandatory = !currentConfig.fields[index].isMandatory;
            updateStats();
        }

        function toggleTemplateActive(index) {
            currentConfig.templates[index].isActive = !currentConfig.templates[index].isActive;
            updateStats();
        }

        function updateStats() {
            const mandatoryCount = currentConfig.fields.filter(f => f.isMandatory).length;
            const activeTemplatesCount = currentConfig.templates.filter(t => t.isActive).length;
            const totalFieldsCount = currentConfig.fields.length;

            document.getElementById('mandatoryCount').textContent = mandatoryCount;
            document.getElementById('activeTemplatesCount').textContent = activeTemplatesCount;
            document.getElementById('totalFieldsCount').textContent = totalFieldsCount;
        }

        async function saveConfiguration() {
            try {
                const response = await fetch('/api/admin/cv-config', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(currentConfig),
                });

                if (response.ok) {
                    currentConfig = await response.json();
                    showMessage('Configuration saved successfully! ✅', 'success');
                } else {
                    throw new Error('Failed to save configuration');
                }
            } catch (error) {
                showMessage('Failed to save configuration: ' + error.message, 'error');
            }
        }

        async function resetToDefaults() {
            if (!confirm('Are you sure you want to reset all configuration to defaults? This cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch('/api/admin/cv-config/reset', {
                    method: 'POST',
                });

                if (response.ok) {
                    currentConfig = await response.json();
                    renderConfiguration();
                    showMessage('Configuration reset to defaults successfully! ⚠️', 'success');
                } else {
                    throw new Error('Failed to reset configuration');
                }
            } catch (error) {
                showMessage('Failed to reset configuration: ' + error.message, 'error');
            }
        }

        function showMessage(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';

            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        // Load configuration on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadConfiguration();
        });
    </script>
</body>
</html>
